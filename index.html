<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 即時互動搶答系統 | 專業穩定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .buzzer-active { animation: pulse 1s infinite; box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #6366f1, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        canvas.conn-status { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden">

    <nav class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="text-2xl">⚡</span>
                </div>
                <h1 class="font-black text-lg tracking-tight">即時搶答系統 <span class="text-xs font-normal text-slate-500 ml-1">v6.5 Stable</span></h1>
            </div>
            <div id="status-tag" class="px-3 py-1 bg-slate-800 rounded-full text-xs font-bold text-slate-400 flex items-center gap-2">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="status-text">未連線</span>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- 階段 1: 角色選擇 -->
        <section id="sec-landing" class="space-y-8">
            <div class="text-center py-10">
                <h2 class="text-4xl md:text-5xl font-black mb-4 gradient-text">讓課堂動起來</h2>
                <p class="text-slate-400 max-w-lg mx-auto">支援 GitHub Pages。只需一個網址，即可完成大屏展示與學生手機連線。</p>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <button onclick="app.initRole('teacher')" class="glass p-8 rounded-3xl hover:border-indigo-500/50 transition-all group text-left">
                    <div class="text-5xl mb-4 group-hover:scale-110">👨‍🏫</div>
                    <h3 class="text-2xl font-bold mb-2 text-indigo-400">我是教師</h3>
                    <p class="text-sm text-slate-400">建立房間，掌控搶答節奏與給分。</p>
                </button>
                <button onclick="app.initRole('student')" class="glass p-8 rounded-3xl hover:border-emerald-500/50 transition-all group text-left">
                    <div class="text-5xl mb-4 group-hover:scale-110">📱</div>
                    <h3 class="text-2xl font-bold mb-2 text-emerald-400">我是學生</h3>
                    <p class="text-sm text-slate-400">掃碼或輸入房間號加入搶答。</p>
                </button>
            </div>
        </section>

        <!-- 階段 2: 教師設定 -->
        <section id="sec-teacher-setup" class="hidden max-w-md mx-auto space-y-6">
            <div class="glass p-8 rounded-3xl">
                <h3 class="text-xl font-bold mb-6">⚙️ 房間設定</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-500 font-bold block mb-2">總題數</label>
                        <input type="number" id="t-total-q" value="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="app.teacherCreateRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold text-lg shadow-xl shadow-indigo-600/20">啟動大屏</button>
                </div>
            </div>
        </section>

        <!-- 階段 3: 教師主控台 -->
        <section id="sec-teacher-dash" class="hidden space-y-6">
            <div class="grid lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <div class="glass p-6 rounded-3xl flex items-center justify-between">
                        <div>
                            <p class="text-[10px] text-slate-500 font-bold tracking-widest">ROOM ID</p>
                            <h2 id="disp-room-id" class="text-4xl font-black text-indigo-400">----</h2>
                        </div>
                        <div class="text-right">
                            <p id="disp-progress" class="text-xl font-black">第 1 題</p>
                        </div>
                    </div>

                    <div id="stage-box" class="glass p-10 rounded-3xl text-center min-h-[400px] flex flex-col items-center justify-center relative">
                        <div id="stage-lobby" class="space-y-6">
                            <h3 class="text-2xl font-bold">等待學生加入...</h3>
                            <div id="lobby-list" class="flex flex-wrap justify-center gap-2 max-w-lg">
                                <p class="text-slate-600 italic">尚未有人連線</p>
                            </div>
                            <div class="flex gap-4">
                                <button onclick="app.toggleQR(true)" class="bg-slate-800 px-6 py-3 rounded-xl font-bold">📱 QR 碼</button>
                                <button onclick="app.startBuzzing()" class="bg-emerald-600 px-10 py-3 rounded-xl font-black text-xl">⚡ 開放搶答！</button>
                            </div>
                        </div>

                        <div id="stage-buzzing" class="hidden space-y-4">
                            <p class="text-emerald-400 font-black animate-pulse">🔥 火熱搶答中...</p>
                            <h1 id="disp-timer" class="text-[120px] font-black leading-none">5</h1>
                        </div>

                        <div id="stage-review" class="hidden space-y-6">
                            <p class="text-indigo-400 font-bold">⚖️ 請判定</p>
                            <h2 id="disp-candidate" class="text-5xl font-black">---</h2>
                            <div class="flex gap-4 w-full max-w-sm">
                                <button onclick="app.judge(true)" class="bg-emerald-600 py-4 rounded-2xl font-black text-2xl flex-1">⭕ 對</button>
                                <button onclick="app.judge(false)" class="bg-rose-600 py-4 rounded-2xl font-black text-2xl flex-1">❌ 錯</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="glass p-6 rounded-3xl">
                        <h4 class="text-sm font-bold text-slate-500 mb-4">🏆 積分榜</h4>
                        <div id="rank-list" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 階段 4: 學生加入 -->
        <section id="sec-student-join" class="hidden max-w-md mx-auto space-y-6">
            <div class="glass p-8 rounded-3xl space-y-6">
                <h3 class="text-xl font-bold">🔑 加入連線</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-500 font-bold block mb-2">房間號</label>
                        <input type="text" id="s-room-id" placeholder="1234" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-2xl font-bold tracking-widest text-center">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold block mb-2">您的暱稱</label>
                        <input type="text" id="s-name" placeholder="小明" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3">
                    </div>
                    <button id="btn-join-room" onclick="app.studentJoin()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold text-lg">連線至大屏</button>
                </div>
            </div>
        </section>

        <!-- 階段 5: 學生搶答區 -->
        <section id="sec-student-dash" class="hidden max-w-md mx-auto text-center space-y-8">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                <div class="text-left">
                    <p class="text-[10px] text-slate-500 font-bold">參賽者</p>
                    <h4 id="disp-my-name" class="font-bold text-emerald-400">---</h4>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold">得分</p>
                    <h4 id="disp-my-score" class="font-black text-yellow-400 text-xl">0</h4>
                </div>
            </div>

            <div class="py-10">
                <button id="buzz-btn" onclick="app.handleBuzz()" class="w-64 h-64 rounded-full bg-slate-800 border-[12px] border-slate-700 flex flex-col items-center justify-center transition-all active:scale-95">
                    <span id="buzz-icon" class="text-6xl mb-2">✋</span>
                    <span id="buzz-text" class="text-xl font-black text-slate-500">等待中</span>
                </button>
            </div>
            <p id="student-hint" class="text-xs text-slate-500 px-4">連線成功，請隨時準備搶答！</p>
        </section>

        <!-- 階段 6: 結算 -->
        <section id="sec-result" class="hidden max-w-md mx-auto text-center space-y-6">
            <div class="text-6xl">🏆</div>
            <h2 class="text-3xl font-black">結算排名</h2>
            <div id="podium" class="glass p-6 rounded-3xl space-y-3 text-left"></div>
            <button onclick="location.reload()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold">返回首頁</button>
        </section>
    </main>

    <!-- QR Code Modal -->
    <div id="modal-qr" class="hidden fixed inset-0 bg-slate-950/90 z-[100] flex items-center justify-center p-6">
        <div class="glass p-8 rounded-[40px] max-w-sm w-full text-center relative">
            <button onclick="app.toggleQR(false)" class="absolute top-6 right-6 text-slate-500">✕</button>
            <h3 class="text-xl font-black mb-4">掃描加入</h3>
            <div id="qrcode-box" class="bg-white p-4 rounded-3xl inline-block mb-6"></div>
            <p class="text-xs text-slate-500 break-all" id="qr-url-text">--</p>
        </div>
    </div>

    <script>
        const app = {
            state: {
                role: null,
                peer: null,
                conn: null,
                room: {
                    id: '',
                    status: 'INIT', 
                    students: [],
                    queue: [],
                    currentQ: 1,
                    totalQ: 5,
                    countdown: 5,
                    currentJudgeIdx: 0
                },
                me: { id: '', name: '', score: 0 }
            },

            init: function() {
                const urlRoom = new URLSearchParams(window.location.search).get('room');
                if (urlRoom) {
                    document.getElementById('s-room-id').value = urlRoom;
                    this.initRole('student');
                }
            },

            initRole: function(role) {
                this.state.role = role;
                document.getElementById('sec-landing').classList.add('hidden');
                if (role === 'teacher') document.getElementById('sec-teacher-setup').classList.remove('hidden');
                else document.getElementById('sec-student-join').classList.remove('hidden');
            },

            updateStatus: function(msg, color) {
                const dot = document.getElementById('status-dot');
                const txt = document.getElementById('status-text');
                dot.className = `w-2 h-2 rounded-full bg-${color}-500 animate-pulse`;
                txt.innerText = msg;
                txt.className = `text-${color}-400`;
            },

            // --- 教師端 ---
            teacherCreateRoom: function() {
                const roomId = document.getElementById('t-total-q').value; 
                const randId = Math.floor(1000 + Math.random() * 9000).toString();
                this.state.room.id = randId;
                this.state.room.totalQ = parseInt(roomId);

                // 使用特定前綴避免全球 ID 衝突
                const peerId = 'QUIZ-ROOM-' + randId;
                this.state.peer = new Peer(peerId);

                this.state.peer.on('open', () => {
                    this.updateStatus('大屏就緒', 'emerald');
                    document.getElementById('sec-teacher-setup').classList.add('hidden');
                    document.getElementById('sec-teacher-dash').classList.remove('hidden');
                    document.getElementById('disp-room-id').innerText = randId;
                    
                    const joinUrl = `${window.location.origin}${window.location.pathname}?room=${randId}`;
                    this.genQRCode(joinUrl);
                    this.state.room.status = 'LOBBY';
                });

                this.state.peer.on('connection', (conn) => {
                    conn.on('data', (data) => this.handleHostData(data, conn));
                });

                this.state.peer.on('error', (err) => {
                    if(err.type === 'unavailable-id') {
                        alert('房間號碼衝突，請重新整理頁面。');
                    } else {
                        alert('連線錯誤: ' + err.type);
                    }
                });
            },

            handleHostData: function(data, conn) {
                if (data.type === 'JOIN') {
                    if (!this.state.room.students.find(s => s.id === data.id)) {
                        this.state.room.students.push({ id: data.id, name: data.name, score: 0, _conn: conn });
                    }
                    this.broadcast();
                }
                if (data.type === 'BUZZ' && this.state.room.status === 'BUZZING') {
                    if (!this.state.room.queue.find(q => q.id === data.id)) {
                        this.state.room.queue.push({ id: data.id, name: data.name, time: Date.now() });
                        this.broadcast();
                    }
                }
            },

            broadcast: function() {
                const r = this.state.room;
                const cleanRoom = { ...r, students: r.students.map(s => ({ id: s.id, name: s.name, score: s.score })) };
                r.students.forEach(s => {
                    if (s._conn && s._conn.open) s._conn.send({ type: 'SYNC', room: cleanRoom });
                });
                this.renderTeacherUI();
            },

            startBuzzing: function() {
                this.state.room.status = 'BUZZING';
                this.state.room.queue = [];
                this.state.room.countdown = 5;
                this.state.room.currentJudgeIdx = 0;
                this.broadcast();
                
                if (this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.state.room.countdown--;
                    if (this.state.room.countdown <= 0) {
                        clearInterval(this.timer);
                        this.state.room.status = (this.state.room.queue.length > 0) ? 'REVIEW' : 'LOBBY';
                    }
                    this.broadcast();
                }, 1000);
            },

            judge: function(correct) {
                const r = this.state.room;
                const winner = r.queue[r.currentJudgeIdx];
                if (correct) {
                    const student = r.students.find(s => s.id === winner.id);
                    if (student) student.score++;
                    if (r.currentQ >= r.totalQ) r.status = 'FINISHED';
                    else { r.currentQ++; r.status = 'LOBBY'; }
                } else {
                    r.currentJudgeIdx++;
                    if (r.currentJudgeIdx >= r.queue.length) r.status = 'LOBBY';
                }
                this.broadcast();
            },

            // --- 學生端 ---
            studentJoin: function() {
                const rid = document.getElementById('s-room-id').value;
                const name = document.getElementById('s-name').value;
                if (!rid || !name) return alert('請輸入完整資訊');
                
                document.getElementById('btn-join-room').disabled = true;
                document.getElementById('btn-join-room').innerText = '正在尋找大屏...';

                this.state.peer = new Peer();
                this.state.peer.on('open', (id) => {
                    this.state.me.id = id;
                    this.state.me.name = name;
                    
                    const conn = this.state.peer.connect('QUIZ-ROOM-' + rid);
                    this.state.conn = conn;

                    conn.on('open', () => {
                        conn.send({ type: 'JOIN', id: id, name: name });
                        this.updateStatus('已連線', 'emerald');
                        document.getElementById('sec-student-join').classList.add('hidden');
                        document.getElementById('sec-student-dash').classList.remove('hidden');
                        document.getElementById('disp-my-name').innerText = name;
                    });

                    conn.on('data', (data) => {
                        if (data.type === 'SYNC') {
                            this.state.room = data.room;
                            this.renderStudentUI();
                        }
                    });

                    conn.on('error', (err) => {
                        alert('連線中斷，請重新整理。');
                        location.reload();
                    });
                });

                this.state.peer.on('error', (err) => {
                    alert('連線失敗：找不到該房間或 Peer 伺服器忙碌。');
                    document.getElementById('btn-join-room').disabled = false;
                    document.getElementById('btn-join-room').innerText = '重試連線';
                });
            },

            handleBuzz: function() {
                if (this.state.room.status === 'BUZZING' && this.state.conn) {
                    this.state.conn.send({ type: 'BUZZ', id: this.state.me.id, name: this.state.me.name });
                }
            },

            // --- UI 渲染 ---
            renderTeacherUI: function() {
                const r = this.state.room;
                document.getElementById('disp-progress').innerText = `第 ${r.currentQ} / ${r.totalQ} 題`;
                document.getElementById('stage-lobby').classList.toggle('hidden', r.status !== 'LOBBY');
                document.getElementById('stage-buzzing').classList.toggle('hidden', r.status !== 'BUZZING');
                document.getElementById('stage-review').classList.toggle('hidden', r.status !== 'REVIEW');
                document.getElementById('sec-teacher-dash').classList.toggle('hidden', r.status === 'FINISHED');
                document.getElementById('sec-result').classList.toggle('hidden', r.status !== 'FINISHED');

                if (r.status === 'BUZZING') document.getElementById('disp-timer').innerText = r.countdown;
                if (r.status === 'REVIEW' && r.queue[r.currentJudgeIdx]) {
                    document.getElementById('disp-candidate').innerText = r.queue[r.currentJudgeIdx].name;
                }

                document.getElementById('lobby-list').innerHTML = r.students.map(s => `<span class="bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full text-xs font-bold border border-indigo-500/30">${s.name}</span>`).join('') || '<p class="text-slate-600">尚未有人連線</p>';
                
                const sorted = [...r.students].sort((a,b) => b.score - a.score);
                document.getElementById('rank-list').innerHTML = sorted.map((s,i) => `<div class="flex justify-between text-sm py-1 border-b border-slate-800"><span>${i+1}. ${s.name}</span><span class="font-bold text-yellow-500">${s.score}分</span></div>`).join('');

                if (r.status === 'FINISHED') this.renderPodium(sorted);
            },

            renderStudentUI: function() {
                const r = this.state.room;
                const meInRoom = r.students.find(s => s.id === this.state.me.id);
                if (meInRoom) document.getElementById('disp-my-score').innerText = meInRoom.score;

                const btn = document.getElementById('buzz-btn');
                const icon = document.getElementById('buzz-icon');
                const text = document.getElementById('buzz-text');
                const hint = document.getElementById('student-hint');

                if (r.status === 'LOBBY') {
                    btn.className = "w-64 h-64 rounded-full bg-slate-800 border-[12px] border-slate-700 flex flex-col items-center justify-center";
                    icon.innerText = "✋"; text.innerText = "準備中"; hint.innerText = "老師準備題目中...";
                } else if (r.status === 'BUZZING') {
                    const alreadyIn = r.queue.find(q => q.id === this.state.me.id);
                    if (alreadyIn) {
                        btn.className = "w-64 h-64 rounded-full bg-slate-700 border-[12px] border-slate-600 flex flex-col items-center justify-center opacity-50";
                        icon.innerText = "✅"; text.innerText = "已送出"; hint.innerText = "請看大屏結果！";
                    } else {
                        btn.className = "w-64 h-64 rounded-full bg-emerald-600 border-[12px] border-emerald-400 buzzer-active flex flex-col items-center justify-center";
                        icon.innerText = "⚡"; text.innerText = "快按我！"; hint.innerText = "就是現在，快搶答！";
                    }
                } else if (r.status === 'REVIEW') {
                    const isMyTurn = (r.queue[r.currentJudgeIdx] && r.queue[r.currentJudgeIdx].id === this.state.me.id);
                    btn.className = isMyTurn ? "w-64 h-64 rounded-full bg-indigo-600 border-[12px] border-indigo-400 buzzer-active flex flex-col items-center justify-center" : "w-64 h-64 rounded-full bg-slate-900 border-[12px] border-slate-800 flex flex-col items-center justify-center opacity-30";
                    icon.innerText = isMyTurn ? "📢" : "⏳";
                    text.innerText = isMyTurn ? "請回答" : "判定中";
                } else if (r.status === 'FINISHED') {
                    document.getElementById('sec-student-dash').classList.add('hidden');
                    document.getElementById('sec-result').classList.remove('hidden');
                    this.renderPodium([...r.students].sort((a,b) => b.score - a.score));
                }
            },

            renderPodium: function(sorted) {
                document.getElementById('podium').innerHTML = sorted.map((s,i) => `<div class="flex justify-between py-2 border-b border-slate-800"><span>${i+1}. ${s.name}</span><span class="font-black text-indigo-400">${s.score} 題正確</span></div>`).join('');
            },

            genQRCode: function(url) {
                const box = document.getElementById('qrcode-box');
                box.innerHTML = '';
                new QRCode(box, { text: url, width: 200, height: 200, colorDark: "#020617", colorLight: "#ffffff" });
                document.getElementById('qr-url-text').innerText = url;
            },

            toggleQR: function(show) {
                document.getElementById('modal-qr').classList.toggle('hidden', !show);
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
